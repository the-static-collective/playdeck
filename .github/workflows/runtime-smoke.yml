name: Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Typecheck
        run: npm run typecheck

      - name: Prove folder to deck ingestion
        run: npm run ingest:proof

      - name: Compose Genesis from deck + track + world rule
        run: npm run compose:genesis

      - name: Project Genesis receipt
        run: npm run receipt:genesis

      - name: Prove guarded continuity with synthetic evidence
        run: npm run continuity:proof

      - name: Prove folder + song command with full render
        run: npm run command:proof

      - name: Prove persistent three-track album deck
        run: npm run album:proof

      - name: Render Genesis hero still
        run: npm --workspace @playdeck/render-remotion run still:genesis

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-001-smoke
          path: |
            packages/render-remotion/out/genesis-001.png
            out/genesis-001-plan.generated.json
            out/ingest-001-deck.generated.json
            out/ingest-001-plan.generated.json
            out/genesis-001-receipt.projected.json
            out/command-001/final.mp4
            out/command-001/deck.json
            out/command-001/track.json
            out/command-001/plan.json
            out/command-001/receipt.rendered.json
            out/command-001/envelope.json
            out/album-001/album.json
            out/album-001/final-deck.json
            out/album-001/tracks/*/deck.json
            out/album-001/tracks/*/plan.json
            out/album-001/tracks/*/receipt.rendered.json
            out/album-001/tracks/*/final.mp4
          if-no-files-found: warn
