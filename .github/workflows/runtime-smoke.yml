name: Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Compose Genesis from deck + track + world rule
        run: npm run compose:genesis

      - name: Project Genesis receipt
        run: npm run receipt:genesis

      - name: Prove guarded continuity with synthetic evidence
        run: npm run continuity:proof

      - name: Render Genesis hero still
        run: npm --workspace @playdeck/render-remotion run still:genesis

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-001-smoke
          path: |
            packages/render-remotion/out/genesis-001.png
            out/genesis-001-plan.generated.json
            out/genesis-001-receipt.projected.json
          if-no-files-found: warn
